<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="400" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="accent2" x1="0" y1="0" x2="200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="iconGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="20" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5" opacity="0.4"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#grid)"/>

  <!-- Decorative glow orbs -->
  <circle cx="150" cy="160" r="120" fill="#06b6d4" opacity="0.04" filter="url(#softGlow)"/>
  <circle cx="1050" cy="160" r="120" fill="#8b5cf6" opacity="0.04" filter="url(#softGlow)"/>

  <!-- Top accent line -->
  <rect x="0" y="0" width="1200" height="3" fill="url(#accent)"/>

  <!-- Database/Dataset icon -->
  <g transform="translate(120, 100)" filter="url(#glow)">
    <!-- Stacked layers representing data -->
    <ellipse cx="40" cy="16" rx="36" ry="12" fill="none" stroke="url(#iconGrad)" stroke-width="2.5"/>
    <path d="M4 16 v20 c0 6.6 16.1 12 36 12 s36-5.4 36-12 v-20" fill="none" stroke="url(#iconGrad)" stroke-width="2.5"/>
    <path d="M4 36 v20 c0 6.6 16.1 12 36 12 s36-5.4 36-12 v-20" fill="none" stroke="url(#iconGrad)" stroke-width="2.5"/>
    <path d="M4 56 v20 c0 6.6 16.1 12 36 12 s36-5.4 36-12 v-20" fill="none" stroke="url(#iconGrad)" stroke-width="2.5"/>
    <!-- Arrow going out -->
    <path d="M80 48 h30 l-8-8 m8 8 l-8 8" stroke="#22d3ee" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Gear/transform symbol -->
    <circle cx="130" cy="48" r="14" fill="none" stroke="#a78bfa" stroke-width="2" stroke-dasharray="6 4"/>
    <circle cx="130" cy="48" r="6" fill="none" stroke="#a78bfa" stroke-width="2"/>
  </g>

  <!-- Title -->
  <text x="310" y="145" fill="#f1f5f9" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="48" font-weight="700" letter-spacing="-1">dataset-builder</text>

  <!-- Tagline -->
  <text x="310" y="185" fill="#94a3b8" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="19" font-weight="400">The all-in-one CLI for building ML datasets</text>

  <!-- Feature pills -->
  <g transform="translate(310, 210)">
    <!-- Pill: Scrape -->
    <rect x="0" y="0" width="88" height="30" rx="15" fill="#06b6d4" opacity="0.15"/>
    <rect x="0" y="0" width="88" height="30" rx="15" fill="none" stroke="#06b6d4" stroke-width="1" opacity="0.4"/>
    <text x="44" y="20" fill="#22d3ee" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Scrape</text>

    <!-- Pill: Generate -->
    <rect x="100" y="0" width="100" height="30" rx="15" fill="#8b5cf6" opacity="0.15"/>
    <rect x="100" y="0" width="100" height="30" rx="15" fill="none" stroke="#8b5cf6" stroke-width="1" opacity="0.4"/>
    <text x="150" y="20" fill="#a78bfa" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Generate</text>

    <!-- Pill: Transform -->
    <rect x="212" y="0" width="104" height="30" rx="15" fill="#ec4899" opacity="0.15"/>
    <rect x="212" y="0" width="104" height="30" rx="15" fill="none" stroke="#ec4899" stroke-width="1" opacity="0.4"/>
    <text x="264" y="20" fill="#f472b6" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Transform</text>

    <!-- Pill: Format -->
    <rect x="328" y="0" width="90" height="30" rx="15" fill="#f59e0b" opacity="0.15"/>
    <rect x="328" y="0" width="90" height="30" rx="15" fill="none" stroke="#f59e0b" stroke-width="1" opacity="0.4"/>
    <text x="373" y="20" fill="#fbbf24" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Format</text>

    <!-- Pill: Clean -->
    <rect x="430" y="0" width="80" height="30" rx="15" fill="#10b981" opacity="0.15"/>
    <rect x="430" y="0" width="80" height="30" rx="15" fill="none" stroke="#10b981" stroke-width="1" opacity="0.4"/>
    <text x="470" y="20" fill="#34d399" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Clean</text>

    <!-- Pill: Translate -->
    <rect x="522" y="0" width="100" height="30" rx="15" fill="#3b82f6" opacity="0.15"/>
    <rect x="522" y="0" width="100" height="30" rx="15" fill="none" stroke="#3b82f6" stroke-width="1" opacity="0.4"/>
    <text x="572" y="20" fill="#60a5fa" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Translate</text>
  </g>

  <!-- Stats bar -->
  <g transform="translate(310, 268)">
    <text x="0" y="12" fill="#64748b" font-family="'Segoe UI Mono', 'Cascadia Code', 'Fira Code', monospace" font-size="13">
      <tspan fill="#22d3ee" font-weight="600">14</tspan>
      <tspan fill="#64748b"> commands</tspan>
      <tspan fill="#334155"> · </tspan>
      <tspan fill="#a78bfa" font-weight="600">22</tspan>
      <tspan fill="#64748b"> search providers</tspan>
      <tspan fill="#334155"> · </tspan>
      <tspan fill="#f472b6" font-weight="600">16</tspan>
      <tspan fill="#64748b"> formatters</tspan>
      <tspan fill="#334155"> · </tspan>
      <tspan fill="#fbbf24" font-weight="600">29</tspan>
      <tspan fill="#64748b"> languages</tspan>
    </text>
  </g>

  <!-- Bottom accent line -->
  <rect x="0" y="317" width="1200" height="3" fill="url(#accent)"/>
</svg>
